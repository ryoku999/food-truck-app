<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2e252c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4e2c8" />
    <title>Sin conexión | Food Truck</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: light-dark(#fffaf0, #2e252c);
        color: light-dark(#382621, #f7e7d9);
      }
      main {
        box-sizing: border-box;
        width: min(calc(100% - 2rem), 26rem);
        padding: 1.5rem;
        border: 1px solid light-dark(#e9d6c0, #674f52);
        border-radius: 24px;
        background: light-dark(#fff7ea, #3e323a);
        box-shadow: inset 0 1px 0 light-dark(#fff9ec, #f9be9c28), 0 8px 20px -12px #38262170;
      }
      h1 { margin: 0.75rem 0 0; font-size: 1.75rem; }
      p { line-height: 1.5; }
      img { width: 4rem; height: 4rem; border-radius: 12px; }
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        padding: 0 1rem;
        border-radius: 12px;
        background: light-dark(#783822, #f3b386);
        color: light-dark(#fff3df, #422822);
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="Food Truck" />
      <h1>Sin conexión</h1>
      <p>Conéctate a internet para continuar con tus pedidos y cobros.</p>
      <a href="/">Volver al inicio</a>
    </main>
  </body>
</html>
